quarkus.http.port=8080

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=token-api

quarkus.rest-client.logging.scope=request-response

# Rest Exchange Rate API
quarkus.rest-client.exchange-rate-api.url=https://free.e-api.net.pe
quarkus.rest-client.exchange-rate-api.connect-timeout=5000
quarkus.rest-client.exchange-rate-api.read-timeout=5000
quarkus.rest-client.exchange-rate-api.scope=all

# Auth Service
quarkus.rest-client.auth-service-api.url=http://auth-token-api:8081
quarkus.rest-client.auth-service-api.connect-timeout=5000
quarkus.rest-client.auth-service-api.read-timeout=5000
quarkus.rest-client.auth-service-api.scope=all

# Auth Service client identifier (credential; injected at runtime)
app.ms.identifier=${APP_MS_IDENTIFIER:}

# DB — values are injected at runtime from environment variables.
# Required: DB_USER, DB_PASSWORD, DB_URL (JDBC form).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:}
# Fail loudly when DB_URL is absent instead of silently starting a Dev Services container.
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.log.console.level=DEBUG